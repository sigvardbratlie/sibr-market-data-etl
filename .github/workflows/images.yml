# Bygger arm64-images (Raspberry Pi / Talos) og pusher til GHCR.
# Kjører på native arm64-runner (gratis for public repos) -> ingen QEMU.
# Tags: sha-<kort-sha> og latest. Deploy skjer manuelt med `make deploy`.
name: images

on:
  push:
    branches: [main]
    paths:
      - "scraping/**"
      - "modeling/**"
      - "api/**"
      - "cadastral/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      modules:
        description: "Moduler (mellomromsseparert)"
        default: "scraping modeling api cadastral"

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mods="${{ inputs.modules }}"
          else
            changed=$(git diff --name-only HEAD~1 HEAD || true)
            if echo "$changed" | grep -q '^.github/workflows/images.yml'; then
              mods="scraping modeling api cadastral"
            else
              mods=$(echo "$changed" | cut -d/ -f1 | sort -u | grep -xE 'scraping|modeling|api|cadastral' | tr '\n' ' ')
            fi
          fi
          echo "modules=$(echo $mods | jq -Rc 'split(" ") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sibr-${{ matrix.module }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/sibr-${{ matrix.module }}:latest
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/sibr-market && helm template t deploy/helm/sibr-market > /dev/null
