[project]
name = "cadastral"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.5.0",
    "google-auth>=2.48.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-bigquery-storage>=2.36.1",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "zeep>=4.3.2",
]

[project.scripts]
cadastral = "cadastral:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "kartverkets-api>=0.1.16",
]
