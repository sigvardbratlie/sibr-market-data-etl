[project]
name = "cadastral"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    "bigframes>=2.35.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-logging>=3.13.0",
    "google-cloud-secret-manager>=2.26.0",
    "google-cloud-storage>=3.9.0",
    "httpx>=0.28.1",
    "kartverkets-api>=0.1.14",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "pandas-gbq>=0.29.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sibr-api>=0.3.2",
    "sibr-module[all,bigquery,secrets]>=0.2.11",
    "zeep>=4.3.2",
]

[project.scripts]
cadastral = "cadastral:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
