[project]
name = "modeling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.8",
    "db-dtypes>=1.5.0",
    "google-auth>=2.48.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-bigquery-storage>=2.36.1",
    "google-cloud-storage>=3.9.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0; sys_platform != 'linux'",
    "xgboost-cpu>=3.2.0; sys_platform == 'linux'",  # uten nvidia/GPU-libs (~400 MB) i containeren
]

[project.scripts]
modeling = "modeling:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
