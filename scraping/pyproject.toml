[project]
name = "scraping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sigvardbratlie", email = "sigvard.bratlie@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.48.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-logging>=3.13.0",
    "itemadapter>=0.13.1",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.2.1",
    "scrapy>=2.14.1",
    "scrapy-playwright>=0.0.46",
    "twisted>=25.5.0",
]

[project.scripts]
scraping = "scraping:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "requests>=2.32.5",
]
