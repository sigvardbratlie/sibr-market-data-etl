{{- /*
Secrets fra values. Legg verdiene i en gitignored fil og send med -f:
  helm upgrade --install sibr-market . -n sibr-market -f values.secrets.yaml
Se values.secrets.example.yaml.
*/ -}}
{{- range $name, $data := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sibr.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

{{- with .Values.imageCredentials }}
{{- if .password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sibr.fullname" $ }}-registry
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sibr.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .registry .username .password (printf "%s:%s" .username .password | b64enc) | b64enc }}
{{- end }}
{{- end }}
