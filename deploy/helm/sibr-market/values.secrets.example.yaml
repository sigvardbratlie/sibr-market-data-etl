# Kopier til values.secrets.yaml (gitignored) og fyll inn:
#   cp values.secrets.example.yaml values.secrets.yaml
#   helm upgrade --install sibr-market . -n sibr-market -f values.secrets.yaml
#
# Nøklene på toppnivå er Secret-navn og må matche steps.<steg>.secretName i values.yaml.
secrets:
  sibr-scraping-env:
    GOOGLE_APPLICATION_CREDENTIALS_JSON: "<base64 service account json>"
    PROJECT_ID: sibr-market
    REGION: europe-west1
    GMAIL_PASSWORD: "<app password>"
  sibr-modeling-env:
    GOOGLE_APPLICATION_CREDENTIALS_JSON: "<base64 service account json>"
    PROJECT_ID: sibr-market
    REGION: europe-west1
  sibr-api-env:
    GOOGLE_APPLICATION_CREDENTIALS_JSON: "<base64 service account json>"
    PROJECT_ID: sibr-market
    REGION: europe-west1
    STATENS_VEGVESEN_API_KEY: "<key>"
  sibr-cadastral-env:
    GOOGLE_APPLICATION_CREDENTIALS_JSON: "<base64 service account json>"
    PROJECT_ID: sibr-market
    REGION: europe-west1
    GRUNNBOK_USERNAME: "<user>"
    GRUNNBOK_PASSWORD: "<password>"

# Kun hvis GHCR-pakkene er private (PAT med read:packages):
# imageCredentials:
#   registry: ghcr.io
#   username: sigvardbratlie
#   password: "<PAT>"
